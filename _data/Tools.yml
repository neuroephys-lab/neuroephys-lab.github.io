- title: neoDBS
  image: /img/tools/NeoDBS2.jpg
  imageLink: https://www.neuro-ephys.org/NeoDBS-Documentation/
  description: "neoDBS is a free open-source user-oriented Python-based toolbox for offline data visualization, processing, and  feature extraction from Percept™ PC/RC + BrainSense™ intracranial patient recordings for electrophysiolgical biomarker discovery. The novel toolbox addresses limitations of previously developed tools   and includes batch processing of multiple recording sessions, event-locked analysis for chronic and in-clinic data, and automatic  feature extraction, in an intuitive browser-like interface with predefined pipelines for users lacking signal processing skills. You can find all information on our [pre-print](https://www.biorxiv.org/content/10.64898/2026.03.27.714691v1.full), on [github](https://github.com/neuroephys-lab/NeoDBS), and on the [documentation wiki](https://www.neuro-ephys.org/NeoDBS-Documentation/)."


- title: BOWIe
  image: /img/tools/BOWIE_overview.jpg
  imageLink: https://github.com/neuroephys-lab/BOWIe
  description: "BOWIe is a compact Brain Optogenetics Wireless Interface headstage especially designed for optical stimulation in closed-loop behavioral paradigms. BOWIe can be assembled with commercially available off-the-shelf components and communicates with a user app via an Arduino-compatible emitter that can be integrated in closed-loop paradigms with analogue or digital stimulation triggers. BOWIe also has a modular design that permits the use of either ferrule-coupled optical fibers or µLED neural probes for flexible choice of optical delivery mode, according to experimental demands or user preference.You can find all information on our [pre-print](https://www.biorxiv.org/content/10.64898/2026.10.13.758187v1) and on [github](https://github.com/neuroephys-lab/BOWIe)."
  
